<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ACCC Acquisitions Register — Notification &amp; Waiver Statistics</title>
    <meta
      name="description"
      content="A mirror of the ACCC Mergers & Acquisitions Acquisitions register, with Phase 1 & 2 notification and waiver statistics."
    />
    <link rel="stylesheet" href="assets/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230b3d5c'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='white' font-family='Georgia,serif'%3EA%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <p class="eyebrow">Mergers &amp; Acquisitions</p>
        <h1>ACCC Acquisitions Register</h1>
        <p class="lede">
          A summary table tracking the ACCC public
          <a
            href="https://www.accc.gov.au/public-registers/mergers-and-acquisitions-registers/acquisitions-register"
            rel="noopener"
            >acquisitions register</a
          >, including Phase&nbsp;1 &amp; 2 notifications and waiver statistics.
          Updated automatically twice daily.
        </p>
      </div>
    </header>

    <main class="wrap" id="main">
      <div id="staleness" class="banner" hidden></div>
      <div id="error" class="banner banner--error" hidden></div>

      <!-- Sections are injected by app.js -->
      <section
        class="section"
        id="section-notifications"
        data-type="Notification"
      ></section>
      <section class="section" id="section-waivers" data-type="Waiver"></section>

      <p id="loading" class="loading">Loading register data…</p>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>
          Source:
          <a
            href="https://www.accc.gov.au/public-registers/mergers-and-acquisitions-registers/acquisitions-register"
            rel="noopener"
            >ACCC Acquisitions register</a
          >
        </p>
      </div>
    </footer>

    <script src="assets/app.js" defer></script>
  </body>
</html>
